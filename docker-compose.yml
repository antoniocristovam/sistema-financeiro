name: finapp

services:
  postgres:
    image: postgres:16-alpine
    container_name: finapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finapp}
      POSTGRES_DB: ${POSTGRES_DB:-finapp}
      # Timezone fixo: o app grava tudo em UTC e converte na apresentacao.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finapp} -d ${POSTGRES_DB:-finapp}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Banco separado para os testes de integracao (Supertest), resetado a cada suite.
  postgres-test:
    image: postgres:16-alpine
    container_name: finapp-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: finapp
      POSTGRES_PASSWORD: finapp
      POSTGRES_DB: finapp_test
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finapp -d finapp_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: finapp-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: finapp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finapp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-finapp123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cria os buckets na subida. Roda uma vez e sai.
  minio-init:
    image: minio/mc:latest
    container_name: finapp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-finapp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-finapp123}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/finapp-attachments;
      mc mb --ignore-existing local/finapp-exports;
      mc mb --ignore-existing local/finapp-imports;
      mc anonymous set none local/finapp-attachments;
      mc anonymous set none local/finapp-exports;
      mc anonymous set none local/finapp-imports;
      mc ilm rule add --expire-days 1 local/finapp-exports || true;
      echo 'buckets prontos';
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: finapp-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  postgres-data:
  redis-data:
  minio-data:
